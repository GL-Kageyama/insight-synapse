hypothesis:
- 就労層を対象としたB2B2Cモデル（企業の健康経営プログラムと連携）は、アクセス入口と費用負担の点で初期ターゲットとして最適であり、個人向けよりも継続率が高くなる可能性がある。
- 継続率と実行率を向上させる決定的な要因は、AIのレコメンド精度よりも、通知タイミングの最適化と社会的比較（同年代・同属性との比較）のナッジである。
- AIの健康アドバイスは、歩数などの行動指標では少なくとも介入3ヶ月で小程度の効果量（Cohen's d=0.3前後）を示すが、長期的な行動維持には追加的な仕掛け（定期的な目標再設定や他者からのフィードバック）が必要となる。
- 疾病リスクが高い層を直接ターゲットにすることは、医療行為とみなされるリスクと説明責任のハードルが高く、B2B2Cモデルの就労層から始めた後に医療機関との連携を拡大する方が現実的である。
- カスタマイズされたプライバシー設定と具体的な便益の提示を行うことで、健康意識が中程度の層からも高いデータ共有同意を得られる可能性がある
- 法人向け価格は、従業員の健康改善効果（プレゼンティーイズム改善など）を金額換算したROIで示すことで、月額1000円/人以上を設定可能になる
- フィードバックの最適頻度は、ユーザーの行動ステージに応じて動的に変化させることで、1ヶ月後のアクティブ率を15%以上に向上できる可能性がある
- 初期リリース時に少数のコア機能（例えば、睡眠と活動量の連動分析のみ）を限定し、UX心理学的なナッジ設計を徹底することで、1か月アクティブ率を既存平均の約10%から15〜20%まで引き上げられる
- 健康保険組合や企業健保とのB2B2C契約を初期から獲得するためには、AIの「推定精度」を提示するだけでは不十分であり、費用対効果（医療費削減効果）をシミュレーションできるダッシュボード機能と、担当保健師向けの管理画面（Anomaly
  detection）をセットで提供することが重要である
- 医療領域（特に疾病診断）を完全に回避し「生活習慣最適化」に特化することで、規制・医療機器該当性リスクを約80%削減できる一方、免責事項表記を過度に多用するとユーザーの信頼を損ない離脱率が上昇するため、表現は「責任の分離」と「エンパワメント（主体性の促進）」のバランスを重視した設計が必要である
- 接続デバイス数を5種から10種に増やすと、統合・品質保証コストは約2倍ではなく約2.5倍となり、組み合わせ爆発による超線形の増加が生じる
- 標準規格への完全準拠を目指すより、標準規格＋変換レイヤー方式の方が、将来のデバイス追加を考慮した費用対効果が高い
- 初期段階では自社アプリ＋連携主要デバイスに絞り、外部データの品質保証は付加価値の高い指標に限定する構成が、コストとリスクのバランスに優れる
