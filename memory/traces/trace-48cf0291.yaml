- 通知の曜日・時間帯を学習者の過去のログから個人適応化することで、非適応時と比較してアドヒアランス率が20%以上向上する。
- 個人最適化の効果は総学習時間の削減よりも定着率（遅延保持率）の向上においてより顕著に現れる。
- 過剰復習を回避する負荷制御（1日あたりの復習上限設定）を組み込むことで、中長期的な継続率が向上し、結果として総定着量が増加する。
- 少数初期データでも、階層ベイズ事前分布と逐次更新を組み合わせ、回答時間や学習時刻などの補助特徴量を加えることで、実用に足る忘却速度の個人差推定が可能である
- 個人最適化復習間隔は固定間隔と比較して、長期的な保持率を同じに保ちながら総学習時間を10〜30%削減できる可能性があるが、確証は得られていない
- 生活リズム適応型リマインダーと説明可能な推奨理由の提示により、アドヒアランス率をベースライン（ランダム通知）から1.5〜2倍程度に向上させられる可能性が高い
- 素材タイプごとに忘却速度パラメータを分離したマルチモーダルモデルは、単一の平均的な忘却曲線を用いるモデルより予測精度が高い
- 初期学習セッションが3回以内でも、階層ベイズによる母集団分布への縮約と逐次更新を組み合わせれば、固定間隔と同等以上の復習タイミング提案が可能である。
