- 個人最適化された復習間隔は、標準的な固定間隔と比較して、同程度の遅延保持率を達成するための総学習時間を20%以上削減する効果を持つ
- 通知を学習者の生活リズム（過去の学習時刻・曜日パターン）に適応させることで、無作為な時間帯の通知と比較してアドヒアランス率を1.5倍以上に改善できる
