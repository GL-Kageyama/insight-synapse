hypothesis:
- 画像認識は完全な個品認識でなくとも、食材カテゴリの粒度（例:中身は野菜・肉など）とユーザー補完の組み合わせで実用できる。
- 初期の課金モデルは無料＋プレミアム（月額300〜500円）が現実的で、特に食材ロスの削減額を明示すれば許容率が上がる。
- アレルギー反映は、初期は完全自動でなくユーザー確認型フィルタ＋注意喚起の方式が最も安全であり、信頼性を高める。
- 最適な入力方法は、スマホカメラを主とし、バーコード・手動入力を補助するハイブリッド方式である。
- 献立提案時に調理時間10分以内や在庫調味料のみなどの制約を反映することで、初心者の実行率が向上する。
- 利用開始から4週間以内に食品廃棄の減少を実感できたユーザーは、継続率が有意に高くなる。
- 食品ロス削減額を可視化することで、月額500円までの支払意思が形成される。
- 生鮮食品の期限管理は、ユーザー入力とレシピ設計の工夫（期限内消費の強調・加熱必須など）により、実際に運用可能なレベルまでリスクを低減できる。
- 食品ロス削減効果は、平均的な家庭で月1,000〜3,000円の食費節約（食品ロス削減量の金銭換算）に相当し、これを可視化することでユーザーの継続利用が促進される。
