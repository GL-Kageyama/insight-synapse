task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：失語症の方の会話を支援するコミュニケーションAI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "## はじめに\n\n「失語症の方の会話を支援するコミュニケーションAI」を、**「生活期・在宅での失語症者が、AIを介して『言いたいことを伝え』『相手の話を理解し』、社会参加を継続できるようにするモバイルアプリ型サービス」**と定義します。完成形の自由会話AIではなく、**「失語症者本人・家族・言語聴覚士（ST）」の三者を支援するAIアシスタント**として構想します。\n\
  \n---\n\n## Target（対象顧客）\n\n### 1次顧客：失語症者本人\n- 脳卒中などで失語症を発症し、急性期・回復期を経た**慢性期・生活期**の人。\n\
  - 特に**軽度〜中等度の失語症者**を最初の対象にします。重度の人は絵カード・シンボル選択で段階的に対応します。\n- 「伝えたいことが伝わらない」「相手の話についていけない」というフラストレーションを日常的に抱えている人。\n\
  \n### 2次顧客：家族・介護者\n- 本人の通訳代わりになり、**「伝わらない」場面での意思確認に疲弊している**家族。\n- 本人の言葉を代弁しすぎることで、本人の主体性が失われることに罪悪感を持つケアラー。\n\
  \n### 3次顧客：言語聴覚士・リハビリ施設・介護事業者\n- 回復期リハビリ病院、ディケア、訪問看護、地域包括支援センター。\n- ST（言語聴覚士）は1対1の対面訓練時間が限られており、**在宅での会話練習を支援する手段が不足**しています。\n\
  \n### 支払者\n- 本人・家族のサブスクリプションに加え、**障害者総合支援法によるコミュニケーション支援機器の自治体支給**、介護保険サービス内の事業者導入、法人契約（リハビリ施設・保険外サービス）を想定します。\n\
  \n---\n\n## Value（提供価値）\n\n### ① 表出支援：本人が「言いたいこと」を伝えられる\n- 絵カード、50音の頭文字、カテゴリ選択、キーワード入力など、本人の残存能力に応じた入力手段をAIが補完します。\n\
  - AIが**次に来そうな語彙・文を予測**し、文全体を音声合成（TTS）で読み上げます。\n- 例：「おなかが痛い」と伝えたいのに「お」しか出てこない人に、「おなかが」「痛い」「病院に行きたい」などを候補提示。\n\
  - これにより、**家族の推測に依存するのではなく、本人が自分の意思で発信できる**ようになります。\n\n### ② 理解支援：相手の話を「わかりやすく」する\n\
  - 相手（看護師・家族・店員など）の音声をAIがリアルタイムで文字化し、\n  - 文を短く区切る\n  - 重要な単語を強調する\n  - 絵記号を付ける\n\
  - たとえば「明日10時に病院で予約があります」→「**明日（絵）10時 病院（絵）**」として提示します。\n- ウェルニッケ失語のように聴覚的理解が難しい人でも、視覚チャネルで意味を確認できます。\n\
  \n### ③ 会話練習・社会参加の拡大\n- 病院での症状伝達、買い物、電話、家族との会話など、**場面別の会話テンプレート**をAIが準備。\n- STが作成した課題をAIが自動変換して、在宅での会話練習を継続できるようにします。\n\
  - 利用ログ（選択語彙、誤選択、反応時間）をSTと共有し、**リハビリ計画の個別化**に使えます。\n\n### ④ 家族・STの負担軽減\n- 家族は「通訳」から「見守り・共感」に役割を変えられます。\n\
  - STは対面セッション以外の時間にも本人の状態を把握でき、**支援の継続性**が高まります。\n\n---\n\n## Risk（リスク）\n\n### 1.\
  \ AIの誤認識・誤生成が深刻な誤解を生む\n- 失語症者の発話は非文法的・断片的な"
