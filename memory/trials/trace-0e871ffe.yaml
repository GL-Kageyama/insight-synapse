task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：日々の雑務を音声でまとめて処理するパーソナル秘書AI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "基于您提供的丰富情报，我将以AI服务企划专家的视角，将已知事实转化为战略判断，将未知风险转化为验证课题，将工作假设转化为可执行的设计原则。\n\
  \n以下从四个维度进行细致分析。由于“如何执行”是多变量问题，我会在文末附上**关键的“未知变量”验证清单**。\n\n---\n\n### 企划概要：帕累托秘书\
  \ AI (Pareto-Sensei)\n\n**核心定位**：不是“会说话的闹钟”，而是“帮您把脑中杂念具现化为可执行清单的**日式职业秘书**”。核心卖点不是“语音识别”，而是**“低摩擦的杂务具现化\
  \ + 高确定性的执行确认”**。\n\n---\n\n### Target（对象顾客）: 明确的“双核驱动”与“垂直深耕”\n\n基于“价格二极化”和“垂直模板有效性”，我们锁定三个具体画像：\n\
  \n**核心付费层（B2B向）：中小企オーナー & 专家（士業）**\n- **描述**：35-55岁，经营小型公司（10人以下）或开设独立事务所（司法书士、税务师、个人诊所）。他们的时间是“生产资料本身”。\n\
  - **关键痛点**：事务性工作（请求书、台账、日程调整、客户资料整理）占用了他们本应用于“接案和决策”的时间。\n- **使用场景**：周末在咖啡馆核对账目时，语音口述“把下周二上午的客户会议改到周四，并给佐藤先生发邮件确认”，AI负责整理并生成待办的邮件草稿和日程更新。\n\
  - **行为特征**：他们无法忍受繁琐的UI，对效率的提升极度敏感，且具备连续付费能力。\n\n**基础渗透层（B2C向）：忙碌的ワーキングペアレント（双职工父母）**\n\
  - **描述**：30-45岁，处于职业上升期，同时照顾孩子和父母。\n- **关键痛点**：生活杂务（购物清单、上下学接送联系、家庭活动安排）造成的微疲劳。\n\
  - **使用场景**：在超市推着购物车，单手点着手机录音“买洗衣液、蓝纹奶酪、厨房用漂白剂”，AI将其结构化地加入购物清单应用（如AnyList或原生备忘录），并在确认UI上显示“已新增3项”。\n\
  - **行为特征**：对价格极其敏感（个人版定价上限约500円/月），但对“微隐私”有很高要求（不被同事听到、不被大数据杀熟）。\n\n**暂缓切入（保留观察区）：高齡者**\n\
  - **理由**：尽管有强需求，但心理阻力（对技术的恐惧）和听觉/发音的复杂变量，不适合MVP阶段。可等上述两类用户中的“中年子女”作为“Bridge”帮助老人设定使用，间接渗透。\n\
  \n---\n\n### Value（提供价值）: 消除“输入摩擦”与“认知负荷”，以“混合UX”建立信任\n\n对目标客户而言，价值不单是“节省时间”，更是**“提升多任务时的掌控感”**。\n\
  \n#### 1. 核心仪表盘（MVP核心价值）：低成本的“任务采集器”\n- **实现方式**：满足“语音输入是打字3倍速度”的效率优势，主攻**“列表追加”和“下草稿”**这两个最高频、最可逆的场景。\n\
  - **价值细节**：用户可以在开车、做饭、洗澡等手忙脚乱时，用一句话将被动的“待办”和“账单”直接转化为结构化的文字**初稿**。\n- **未来进化**：基于“履历数据”进行主动建议，例：“您每周三下午通常安排下周会议，需要现在生成议程模版吗？”（验证假说：履历提升20%留存）。\n\
  \n#### 2. 决定性差异体验（混合UX）：可逆性+高透明的“交接仪式”\n- **设计核心**：既然“误操作不安”是首要心理障碍，我们就将其限定在一个安全边界内。\n\
  - **“草稿-批准”工作流**：AI只负责写“初稿”、列出潜在执行项。任何不可逆的操作（发送邮件、变更日程、支付账单）都会在**屏幕UI上弹出“确认卡片”**，并附带撤销按钮。\n\
  - **环境切换模式**：\n    - **办公室（专注模式）**：提示用户“轻声耳语”，并默认切换到**可见的文本确认UI**"
