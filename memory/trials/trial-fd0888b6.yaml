task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：日々の雑務を音声でまとめて処理するパーソナル秘書AI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "## サービス定義\n\n「日々の雑務を音声でまとめて処理するパーソナル秘書AI」は、ユーザーが「今日の雑務をまとめて」と話すだけで、メール・カレンダー・メッセージ・タスク管理サービスからタスクを抽出し、優先順位付けしたうえで、予定登録・定型連絡・申込入力・書類作成などを代理実行するサービスです。\n\
  \n音声を入口にしながらも、確認・編集・実行ログはアプリやLINEのカードUIで可視化し、「まかせっぱなし」ではなく「頼める秘書」として設計します。\n\n---\n\
  \n## Target（対象顧客）\n\n### 1. 共働きの30〜45歳・子育て層（最優先セグメント）\n\n- **具体像**: 小学生〜中学生の子どもがいる共働き家庭。仕事が不規則で、夕方に学校メールや塾の連絡、PTA・自治会・病院予約などをまとめて処理している。\n\
  - **代表的な雑務**:\n  - 学校・習い事からのメールやお便りの確認・返信\n  - 保護者面談の日程調整\n  - 病院や歯科の予約・変更\n  -\
  \ 授業参観・PTA役員会のリマインド\n  - 宅配や子どもの習い事の送迎スケジュール整理\n- **切実な要望**: 「必要なことを忘れない」ことと、「家事・育児の合間に手が空かなくても、ちょっとした連絡を処理できる」こと。\n\
  \n### 2. 個人事業主・フリーランス・小規模事業者（重点セグメント）\n\n- **具体像**: 営業・制作・経理・広報を一人で兼任している。売上につながる作業に集中したいのに、請求書や顧客対応などの雑務に時間を取られる。\n\
  - **代表的な雑務**:\n  - 請求書の作成・送付・催促メール\n  - 経費の仕訳や会計ソフトへの入力\n  - 顧客との打ち合わせ日程調整\n  -\
  \ 契約書や見積書のひな型作成\n  - 納品後のフォローアップ連絡\n- **切実な要望**: 月数時間〜十数時間単位の事務削減。自分の単価に換算して「売上を生む時間」を取り戻したい。\n\
  \n### 3. 大企業・官公庁の管理職・営業マネージャー（拡張セグメント）\n\n- **具体像**: 会議が多く、メールや書類承認が膨大。スケジュールの空きがなく、移動中や隙間時間に雑務を処理している。\n\
  - **代表的な雑務**:\n  - 社内外の会議日程調整\n  - 出張申請・経費精算の下書き作成\n  - 週次報告や議事録の要約作成\n  - 定型メールの下書き作成と送信判断\n\
  \  - 部下からの承認依頼の優先順位整理\n- **切実な要望**: 自分が意思決定と重要なコミュニケーションに集中できる状態を、AIに常時アシストしてほしい。\n\
  \n---\n\n## Value（提供価値）\n\n### 共通価値: 「頭の中の雑務を預けて、注意力と時間を取り戻す」\n\nこのAIの本質的な価値は、タスクを「記録する」だけでなく、「音声で預けたら、処理まで進めてくれる」ことです。\n\
  \n### セグメント別の価値\n\n#### 子育て層への価値\n\n- 保育園・学校・塾の連絡を音声で読み上げ要約し、「◯日までに必要な対応」を自動抽出。\n\
  - 「来週のPTAの返信を、先生にこう返して」と話すだけで、文面が下書きされ、承認後に返信。\n- 家事や送迎で手が離せない時間でも、頭にある家中の雑務を**外に書き出す**ことで、夜の家庭内ストレスが減る。\n\
  - 配偶者とタスクを共有できるため、「私だけが把握している」状態を解消する。\n\n####"
