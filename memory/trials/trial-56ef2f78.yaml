task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：在宅勤務者の集中力維持をサポートするタスク管理AI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "## 分析対象の定義\n\n本テーマの「タスク管理AI」を、次のように定義します。\n\n**在宅勤務中の作業ログ・カレンダー・タスク情報から「注意力の変化」を推定し、タスクの分解・最適な時間配置・休憩タイミング・業務の切り上げ提案を行うAIアシスタント**です。\n\
  \n---\n\n## Target（対象顧客）\n\n### 1次顧客：在宅勤務の知識労働者\n- **典型例**：リモート中心のエンジニア、デザイナー、編集者、研究職、経営企画など\n\
  - **特徴**：複数のタスクを並行して抱え、「やるべきことは分かっているが、集中が続かない」という自己調整の課題を持つ\n- **これまでの失敗体験**：TodoistやAsanaなどのタスク管理ツールは「計画を立てる」だけで、実際の集中力維持まで支援してくれなかった人\n\
  - **導入されやすい属性**：自分の生産性向上に投資意欲がある30〜40代の専門職。在宅勤務による孤独感やメリハリ不足を自覚している人\n\n### 2次顧客：企業の人事・IT部門・経営層\n\
  - **典型例**：フルリモートまたはハイブリッド勤務を導入している企業\n- **ニーズ**：\n  - 「在宅で本当に仕事をしているか」という不安の解消\n\
  \  - 従業員の過重労働・燃え尽き症候群の予防\n  - チーム全体の生産性向上（長時間労働ではなく、アウトプットの質を高めたい）\n- **購買形態**：個人向けには無料〜低価格で提供し、企業向けには管理ダッシュボードを有料化するB2B2Cモデルが適する\n\
  \n---\n\n## Value（提供価値）\n\n### 個人にとっての価値\n\n#### 1. 「自分の集中パターン」を可視化する\n- 多くの在宅勤務者は「なんとなく午前中は調子が良い」程度の認識しか持っていない\n\
  - 本AIは過去の作業時間・成果物・自己申告から、**人ごとの集中曲線**を学習\n- 例：火曜日の10時〜12時に最も深い集中ができる人には、その時間に「設計書を書く」などの高難度タスクを自動配置\n\
  \n#### 2. タスクを「実行可能な大きさ」に分解する\n- 「資料作成」のような曖昧なタスクは集中力を削ぐ\n- AIが「情報収集 → アウトライン作成\
  \ → スライド作成 → 推敲」のように分解し、各ブロックを10〜30分の集中単位に変換\n- 実行ハードルを下げることで、**「手がつけられない」状態を防ぐ**\n\
  \n#### 3. 注意散漫への「優しい介入」\n- タスク実行中にSNSやニュースサイトを開いた際、強制ブロックではなく「今やっているタスクに戻りますか？」と選択肢を表示\n\
  - 「あなたの集中が途切れています」ではなく、**自己決定を促す声かけ**を行う\n\n#### 4. 疲労・過剰労働の防止\n- 作業時間やタスクの進捗遅延から疲労度を推定し、休憩を提案\n\
  - 就業時間後の通知を抑制し、「明日の最初の1手」を自動生成して当日の業務を心理的に終わらせる\n- これにより、**在宅勤務で課題となる「仕事と生活の境界の曖昧さ」を解消**する\n\
  \n### 組織にとっての価値\n\n- 個人を特定しない形でチームの集中時間帯・会議による分断・深夜作業の傾向を集計\n- 例：「このチームは午後に集中の谷がある」「新しいメンバーに過剰なタスクが集中している」といった**組織課題を発見するデータ**を提供\n\
  - 人事へは、休職リスクの早期兆候（深夜作業の連続・休憩なし・納期遅延の増加）を匿名アラートとして通知\n\n---\n\n## Risk（リスク）\n\n###\
  \ 1. 監視・プライバシーリスク（最重要）\n- 作業ログを取得するため、「上司に監視されている」という心理"
