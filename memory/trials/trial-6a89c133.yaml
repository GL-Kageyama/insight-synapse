task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：スポーツ愛好家向けにフォームを動画から分析するトレーニングAI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "AIサービス企画の専門家の視点から、テーマ「スポーツ愛好家向けにフォームを動画から分析するトレーニングAI」を、**整合性**と**実行可能性**を重視して分析します。\n\
  \n---\n\n### 分析の結論（エグゼクティブサマリー）\n本サービスは、**「ランニング愛好家」** に焦点を絞ってMVPをローンチするのが最も実行可能性が高いです。\n\
  当初は「コーチングを受けられない自己流トレーニング層」をターゲットに、**「怪我の予防」** と **「記録の向上」** をデータで実証しながら提供します。リスクとして想定される医療的免責・個人情報保護は、**専門医との連携とオンデバイス処理**で克服し、将来的には**保険市場やデータヘルスケア市場への展開**という大きな機会を掴み取ります。\n\
  \n---\n\n### 1. Target（対象顧客）\n\n漠然と「スポーツ愛好家全体」を対象にすると、スポーツごとの専門知識が不足し失敗します。そこで、**「決定的なペインポイントを持つ特定のセグメント」**\
  \ に絞ります。\n\n-   **ターゲット顧客**：**「ジャストネット」な都市部在住のランニング愛好家（特にハーフマラソン~フルマラソンに挑戦する初心者〜中級者）**（30〜45歳）\n\
  -   **選定理由**：\n    -   **可視化の容易さ**：ランニングフォームは、スマホで横からの動画を撮るだけで解析に十分な正面・側面のデータが得られます。ゴルフやテニスと違い、場所や機材の制約が少ない。\n\
  \    -   **明確なペイン**：特に初マラソン挑戦者は「自己流で走っていて、腰が痛い」「膝が痛い」などの怪我に悩む一方、パーソナルコーチ（月数万円）には手が出せないという「未解決のニーズ」があります。\n\
  \    -   **行動変容の起こしやすさ**：ガジェット好きが多く、スマートウォッチ等でランニングダイナミクス（ピッチ、上下動）に興味を持つ層で、AIへの心理的障壁が低い。\n\
  \n---\n\n### 2. Value（提供価値）\n\n単なる「フォームの可視化」ではなく、**「具体的な改善行動」** までを導くことが価値の核心です。\n\
  \n-   **V1. 専門知識の民主化（コーチ代の代替）**：\n    -   パーソナルコーチなしで、**「骨盤の並進運動が過小」「着地時の膝の外反が大きい」**\
  \ というような、これまで熟練の眼でしか判断できなかった**客観的・定量的なフォーム診断**を、数百円のアプリ課金で提供します。\n-   **V2. リハビリテーションと予防の連携（怪我リスクの定量化）**：\n\
  \    -   動画解析から**左右の非対称性の指標（OCL：オーバーラップテンポ等）** を算出し、翌日の故障リスクをスコア化します。「痛みを感じる前に、負荷が偏っている個所」を警告することで、**トレーニングを継続できる状態（期間）を最大化**します。\n\
  -   **V3. 進化するトレーニング計画のパーソナライズ**：\n    -   フォームの改善度を自動追跡し、「前回のデータより、ここが改善したから、次のステップはこのドリル（坂道ダッシュ）を推奨します」というように、**改善プロセスに応じて次に推奨するドリルが変わる**、ゲーミフィケーション的な成長体験を提供します。\n\
  \n---\n\n### 3. Risk（リスク）\n\n**最も重要なのは医学的リスクです**。数字の上では正しくても、実際の人間の身体は異なり、誤った指示が怪我を誘発する可能性があります。\n\
  \n-   **R1. 「AIの誤診」による怪我の訴追（重大リスク）**：\n    -   データ上は問題がないのに、AIが「フォームが悪い」と判定した結果、ユーザーが過度な矯正を行いシンスプリント（脛骨過労性骨膜炎）になるケースが考えられます。\n\
  \    -   **対策（実行可能性）**：アプリ内で診断は「エビデンスベースの統計的傾向」であると明示し、**医師（整形外科医）監修のもとで「安全域」の定義**を行います。また、利用規約で「医療行為ではないこと」を明確化します。（国内スポーツ整形外科の学会との連携を必須とします。）\n\
  -   **R2. 身体データという機微情報の取り扱い（プライバシー）**：\n    -   身体のシルエット、動き方、そして怪我の部位情報は機微な生体データです。データ漏洩が起きれば企業の存続に関わります。\n\
  \    -   **対策**：動画データをサーバーに上げず、**端末内（オンデバイス）で推論処理を行うEdge AI技術**を採用し、プライバシー設計を担保します（セキュリティを売りにすることも可能）。\n\
  -   **R3. 正確性に対する過信（UX上のリスク）**：\n    -   数値が高い精度で出てくるため、ユーザーが自分の感覚を無視してAIに従いすぎる「Automation\
  \ Bias（自動化バイアス）」が発生します。\n    -   **対策**：「痛みが出たら絶対に中止」という絶対条件をUIの最初の画面に組み込み、AI分析結果はあくまで「コーチのアドバイス」のレベルで出力（診断書のような印象を与えない）し、医療機関への一次スクリーニングとしての位置づけに保ちます。\n\
  \n---\n\n### 4. Opportunity（機会）\n\n単なる動画分析アプリを超えて、**「予防医療データプラットフォーム」** に発展させる大きな機会があります。\n\
  \n-   **O1. 保険分野との協業（市場獲得）**：\n    -   運動による傷害（ランニング障害）は、治療費と保険金の支払いにつながります。**当社のデータで「運動習慣の継続」と「フォーム改善の証跡」を証明できれば、損害保険会社向けの健康増進型保険（ヘルスケア特約）に対応できます**。保険会社からユーザーへの補助金が出れば、価格感度の高い層の導入障壁を下げられます。\n\
  -   **O2. プロフェッショナル層への横向き展開（新市場）**：\n    -   ランニングで培った骨格推定エンジンを、**ゴルフスイング、野球のピッチング、バレエやヨガのポーズ指導**に水平展開できます。特にピッチングやゴルフのレッスン市場はランニング市場よりも高単価なので、BtoB（スポーツクラブ、部活動）への販売チャネルが広がります。\n\
  -   **O3. アーカイブデータのネットワーク効果（競争優位性の構築）**：\n    -   利用者が増えるほど「どのフォームが最終的にタイムに寄与したか」「どのフォームの歪みが中長期的に怪我につながったか」というビッグデータを利活用し、AIの診断精度を自己改善させることができます。このデータ量を蓄積したAIの予測モデルは、後発の競合には簡単に模倣されない**「データの堀（スイッチングコスト）」**\
  \ が形成されます。\n\n---\n\n### 実行可能性を高めるためのロードマップ（次の一手）\n\n1.  **フェーズ1（3ヶ月）**：スポーツ整形外科医をアドバイザーに招聘し、「フォームの異常値」と「傷害リスク」の因果関係を示すロジックモデルを学術論文のレビューで構築する。\n\
  2.  **フェーズ2（6ヶ月）**：モニター100名（Tokyo Marathonの当選者など）を集め、週に1本の動画でフォーム改善効果を実証する小規模な検証実験を行い、**「怪我の予防率」と「自己ベスト更新率」**\
  \ という2つのKPIを公開する。\n3.  **フェーズ3（9ヶ月）**：オンデバイス推論に対応したWebアプリ（iOS/Android）をローンチし、月額980円の定額プランを提供する。\n\
  \nこのように、Target（ランナー）・Value（リスク予防と効率改善）・Risk（医療的保証）・Opportunity（データプラットフォーム化）が相互に循環することで、**単なるアプリではなく、人々の運動を安全に永続させる社会インフラとしてのAIサービス**になります。"
