task_prompt: 'あなたはAIサービス企画の専門家です。以下のテーマについて、

  Target（対象顧客）・Value（提供価値）・Risk（リスク）・Opportunity（機会）の観点から分析してください。


  テーマ：不動産投資の物件選定をサポートする投資判断AI


  分析は具体的に。どのような顧客が、どのような価値を得て、何がリスクで、

  どのような機会があるのかを、整合的で実行可能性のある形で記述してください。'
artifact: "# 不動産投資の物件選定をサポートする投資判断AI 分析\n\n## はじめに\n\n本AIは、物件スペック・市場データ・エリア特性・リスク要因を統合し、投資判断の根拠を「見える化」するサービスです。ただし「AIが自動で『買い』と判定する」のではなく、人間が最終判断するための**判断支援ツール**として設計します。\n\
  \n---\n\n## 1. Target（対象顧客）\n\n| セグメント | 具体的な顧客像 | 抱える課題 |\n|---|---|---|\n| **個人投資家（中級）**\
  \ | 都心勤務のサラリーマンで年1〜3件の区分マンションや戸建てを検討。すでに1〜2件保有。 | 比較検討に時間がかかる。利回りだけで買って空室リスク・修繕リスクを見落とす。\
  \ |\n| **不動産投資会社・ファンド** | 首都圏・地方都市で複数物件を探索する運用担当者。 | 大量の物件情報から収益性とリスクのバランスを見極めるスクリーニングに工数がかかる。\
  \ |\n| **不動産仲介会社の営業担当** | 売主から媒介依頼を受ける仲介営業。 | 買主に対する提案に説得力がなく、成約まで時間がかかる。 |\n| **金融機関（融資審査）**\
  \ | 不動産投資ローンを扱う銀行・信用金庫の審査担当。 | 担保評価に加え、将来の収益性・エリアリスクの定量的な評価が難しい。 |\n\n初期ターゲットは、**個人投資家と仲介会社**です。\n\
  理由は、意思決定が比較的速く、データ提供やフィードバックが得やすいためです。その後、ファンド・金融機関へ展開します。\n\n---\n\n## 2. Value（提供価値）\n\
  \n### 主な価値\n1. **物件スコアリングの大幅な効率化**\n   - 価格・築年数・利回り・エリア人口・賃貸需要・地価動向・災害リスク・空室率などを統合し、投資判断スコアを算出。\n\
  \   - 例：「10件の物件リストから、投資基準に合う3件に絞り込む」という作業が数クリックで完了する。\n\n2. **「納得感」のある根拠を示す**\n\
  \   - 単なるスコアではなく、「なぜこの物件が優れているのか」を文章と数値で説明。\n   - 例：「駅徒歩9分・築25年だが、周辺の単身世帯比率が高く賃貸需要が堅調。一方、浸水リスクがあるため、保険料を考慮した実質利回りは4.1%程度です。」\n\
  \n3. **将来シナリオのシミュレーション**\n   - 金利上昇・家賃下落・大規模修繕などに対するキャッシュフロー変化を想定。\n   - 投資期間中のNPV（正味現在価値）やIRR（内部収益率）を可視化。\n\
  \n4. **投資家ごとの基準にカスタマイズ**\n   - 「利回り重視」「資産価値重視」「災害リスク回避」など、ユーザーが設定したウエイトでスコアリングが変わる。\n\
  \nこれにより、顧客は「直感や営業トーク」ではなく、**再現性のあるデータで投資判断できる**ようになります。\n\n---\n\n## 3. Risk（リスク）\n\
  \n### 3-1. データ・モデルリスク\n- **過去データへの依存**: 成約価格や賃料データは過去の情報であり、将来の市場変動を必ずしも反映しない。\n\
  - **データの偏り**: 取引事例が少ないエリアの物件ほど精度が落ちる。\n- **マクロ変数**: 金利・景気・人口移動などが急変した場合、モデルが追いつかず評価がずれる。\n\
  \n**対策**: 予測には必ず信頼区間を示し、「参考値」であることを明記。モデルは定期的に再学習し、予測精度を公開する。\n\n### 3-2. 利用者リスク\n\
  - **AIへの過信**: ユーザーがスコアだけを見て実物確認や契約条件の精査を怠る。\n- **不適切な投資**: リスク許容度が低い初心者が高リスク物件を購入してしまう可能性。\n\
  \n**対策**: ユーザーに投資経験・リスク許容度を登録させ、推奨レベルを調整する。また「最終判断は本人」という注意喚起をUI・契約に組み込む。\n\n###\
  \ 3-3. 法律・規制リスク\n- 不動産は金融商品ではありませんが、**収益物件の投資判断支援**という性質によっては投資助言とみなされる可能性があります。\n\
  - 宅建業法・景品表示法上の「不動産広告」に抵触しないよう、表示方法や文言の精査が必要。\n- 説明文やスコアが「断定的な判断」と捉えられると、万一の損失時に責任問題へ発展する恐れ。\n\
  \n**対策**: 法的には「提案シミュレーター」という位置づけにし、必ず宅建士・弁護士のレビューを通す。レポートには「推奨ではなく参考情報」と明記します。\n\
  \n### 3-4. ビジネスリスク\n- 既存のポータルサイトや大手企業が同様の機能を追加するリスク。\n- データ収集・更新コストが高く、初期の利用者数が少ないとサービス維持が困難。\n\
  \n**対策**: 差別化として「説明可能なAI（XAI）＋シナリオシミュレーション」に集中する。データは公開情報を活用しつつ、仲介会社・管理会社との提携で独自データを確保します。\n\
  \n---\n\n## 4. Opportunity（機会）\n\n### 4-1. 社会課題と市場成長\n- 空き家・相続不動産の増加により、売買・投資判断のニーズは拡大。\n\
  - リモートワーク定着で地方都市の住宅ニーズが変化し、従来の「利回りだけ」では測れない価値創出の余地がある。\n- 不動産テック市場は成長期であり、特に「投資支援」分野はまだ競争が激しくない。\n\
  \n### 4-2. 公開データの充実\n- 国土交通省の不動産取引価格情報、国土数値情報、ハザードマップ、人口統計など、活用可能な公開データが増えている。\n\
  - これらを統合するだけで、一定の付加価値を提供できる。\n\n### 4-3. 金融機関・保険との連携\n- 融資審査や保険商品設計に、当AIのリスク分析を組み込む可能性。\n\
  - 銀行が「この物件はAI上でも妥当な担保価値」と判断できれば、融資までの時間短縮・顧客満足度向上につながる。\n\n### 4-4. 生成AIとの組み合わせ\n\
  - 自然言語で「利回り8%以上、駅10分以内、災害リスクの低い物件」と入力すると、条件に合う物件とその解説を自動生成。\n- 投資初心者向けに「なぜこの物件を選ぶべきか」を平易な表現で説明する機能を追加できる。\n\
  \n### 4-5. 周辺サービスへの拡張\n- 初期は「物件選定」だが、将来的には\n  - 保有物件の売却タイミング判断\n  - 複数物件をまとめたポートフォリオ診断\n\
  \  - 管理会社・修繕費のコスト比較\n- という形で、投資家の意思決定全体を支援するプラットフォームへ拡大可能。\n\n---\n\n## 5. 実行可能性を高めるためのサービス設計\n\
  \n### フェーズ1（初期）\n- 対象は「首都圏の中古区分マンション」に限定。\n- 公開データ＋一部提携データでMVP（最小実行可能製品）を提供。\n-\
  \ 月額サブスクリプション（3,000〜5,000円程度）で、個人投資家に「10物件のランキング＋理由」を提供。\n\n### フェーズ2（成長期）\n- 仲介会社向けに、顧客への提案資料作成機能を追加。\n\
  - 「この物件でこの条件だと、将来こう"
