artifact: '## テーマ定義：日々の雑務を音声でまとめて処理するパーソナル秘書AI


  本サービスの核心は、ユーザーが思いついた雑務を音声で「投げる」だけで、AIがタスクを構造化・整理し、カレンダー・メール・EC・予約サイトなどの外部サービスと連携して**処理まで代行する**ことです。さらに、毎朝・毎夕に一日の雑務を音声で要約し、優先順位を提案します。


  ---


  ## Target（対象顧客）


  ### 一次ターゲット：時間貧困層のビジネスパーソン

  - **人物像**：35〜50歳の管理職・ITエンジニア・コンサルタント・医師など。週の労働時間が50時間以上で、自分の予定管理や連絡調整に1日1〜2時間を奪われている。秘書を雇えるほど裕福ではないが、月額2,000円程度の支出には抵抗がない。

  - **特徴**：GoogleカレンダーやSlack、Gmailを日常的に使い、音声入力もある程度使える。ただし、手動のタスク整理に強いストレスを感じている。


  ### 二次ターゲット：共働き子育て世帯

  - **人物像**：子どもがいる30代〜40代の共働き夫婦。特に妻（あるいは夫）が「保育園の連絡」「習い事の送迎調整」「買い物リストの共有」など家族全体の雑務を抱え込んでいる。

  - **特徴**：家族共有のリマインダーアプリやLINEノート等を活用しているが、情報が散在して漏れる。音声入力で家族にタスクを共有したい。家庭内の「共通の記憶装置」としての需要。


  ### 三次ターゲット：中小企業の経営者・個人事業主

  - **人物像**：いわゆるいわゆる「雇えない秘書」層。請求書の支払いや役所への提出物、顧客への連絡等、バックオフィス業務が雑務化している。

  - **特徴**：複数の業務ツールを使っているが、事務員を置くほどの規模ではない。AIの導入に前向きで、時間コストを貨幣コストに換算できる。


  ---


  ## Value（提供価値）


  ### 1.「投げるだけ」で時間を回収する

  - 個々の雑務は5分程度でも、発生するたびに文脈を切り替えると数十分かかる。音声で「明日9時に会議室を取り直して、参加者に日程変更を送って」という一言で、AIが予約システムとメール送信を完了させる。ユーザーはその間、別の作業に集中できる。

  - **具体例**：朝の通勤中に「今日は早く帰りたいから、18時以降の予定を明日に振り替えて。あと、帰りに薬局に寄って」と言えば、AIがカレンダー調整と買い物リストへの追加を処理し、帰宅ルートに応じたドラッグストアまで提案する。


  ### 2. 記憶と負荷の外部化

  - 「あれもやらなきゃ、これもやらなきゃ」という心理的圧迫感が軽減される。AIが日々の雑務を分類し、**「今日やること」と「明日以降で良いもの」**に整理して音声で伝える。

  - ユーザーは何かを覚えている必要がなくなるため、ワーキングメモリを本質的な仕事や家庭との時間に使える。


  ### 3. 実行の質を高める「提案型アシスト」

  - 単なるリマインダーではなく、文脈を加味した優先順位付けを行う。たとえば「上司からメールが来ているけど、明日の朝までに返したい」と言えば、AIが返信文のドラフトを作成し、ユーザーは承認だけする。

  - 緊急度・重要度・相手との関係性を学習し、**「これは明日に回してよいですか？」**という形で確認してくるため、判断コストも減る。


  ### 4. バラバラのアプリを横断する「メタ層」になれる

  - カレンダー・メール・チャット・EC・銀行アプリ等に直接手を触れず、音声で指示するだけで処理が完結する。**「ツールを操作する時代」から「目的を伝える時代」へ**の移行価値を提供する。


  ---


  ## Risk（リスク）


  ### 1. プライバシー・セキュリティ（最重要）

  - 音声データには、健康情報・恋人関係・取引先との機密・子どもの情報など極めてセンシティブなものが含まれる。クラウドで処理することへの拒否感が強い層が一定数存在する。

  - 外部サービス（カレンダー、メール等）への権限付与により、不正アクセスや従業員によるデータ閲覧事故が起きると、サービス全体の信用崩壊につながる。

  - **対策**：音声データのオンデバイス一次処理、エンドツーエンド暗号化、データ保持期間の最小化、第三者監査を実施したうえで「プライバシーベースで作られた秘書AI」というブランド化を図る。


  ### 2. 誤認識・誤実行による実害

  - 音声認識の誤り（「9時」と「19時」）や意'
