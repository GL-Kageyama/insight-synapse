artifact: '# パーソナル健康AI事業の分析（具体的・整合的・実行可能な枠組み）


  ---


  ## 1. Target（対象顧客）の具体化


  ### セグメント別の実像と優先順位（仮説）


  | セグメント | 記述 | 獲得難度 | 収益性の見込み | 優先度 |

  |---|---|---|---|---|

  | **健康意識の高い個人** | 30〜50代男女。ウェアラブル端末は所有済みだが、データの見方が分からず活用しきれていない。「記録は続かない」経験を持つ層。
  | 比較的低い（アプリ経由で獲得可能） | 月額課金500〜1,000円が限界の可能性 | 初期の実証対象として優先 |

  | **生活習慣病予備群** | 健診で「要指導」判定を受けたが、医療機関には未受診の層（高血圧・血糖・脂質の境界域）。課題は運動・食事・睡眠の具体的改善。 |
  中程度（健診結果は企業・保険者が保有しており、アプローチに経路が必要） | 保険者・企業経由なら1人あたり月額1,000〜3,000円程度のB2B価格が成立しうる
  | 1〜2年後に注力 |

  | **慢性疾患患者（軽症〜中等症）** | 高血圧・糖尿病などの診断済みで、日常の自己管理（食事・運動・服薬）を医師から指導されている患者。医療連携が前提のため、初期の直接アプローチは回避が賢明。
  | 高（医療機関の紹介・協力が必須） | 保険適用や医療機関との役割分担ができれば高収益だが、実現まで長期 | 中期（3年目以降）に再評価 |

  | **健康経営を進める企業** | 従業員健診の有所見率が高く、医療費適正化・プレゼンティーイズム対策を課題とする企業および健康保険組合。 | 中程度（健康保険組合の保健事業費を活用できる可能性）
  | 企業・健保との契約で、従業員1人あたり年間1,500〜5,000円程度の価格が想定可能 | 実証後、主要チャネル化 |


  **選定基準**: 初期は「データ取得のハードルが低く、AI提案を直接試せる健康意識の高い個人」と「企業経由でまとまった人数にリーチできる健康経営セグメント」の2本柱が実行可能と考えます。ただし、これは仮説であり、顧客インタビューで優先順位を検証する必要があります。


  ---


  ## 2. Value（提供価値）の具体化と実現条件


  ### 価値の三層構造


  **価値1: 「気づき」の提供 — 現在の状態の理解**

  - 血圧・体重・睡眠・歩数などの記録から、週間・月間の変動パターンを可視化

  - 例:「火曜日の睡眠が6時間未満になると、木曜日の血圧が上昇する傾向があります」

  - 既存の記録アプリ（MyFitnessPal等）は「記録」が主機能であり、「傾向の説明」は不十分。ここを差別化する

  - 実現条件: データが2週間〜1ヶ月以上蓄積されること（継続率が前提）


  **価値2: 「具体的アクション」の提案 — 次に何をすべきか**

  - 「帰宅後のスマホ使用時間を15分減らすと、睡眠時間が平均20分延びる可能性があります」

  - 「朝のウォーキングを平日に20分追加すると、体重減少のペースが1.5倍になる見込みです」

  - 提案は**「生活改善のヒント」**の範囲に限定し、診断・治療・薬物療法の示唆は行わない。これが規制リスク回避の要

  - 実現条件: 過去データと外部データ（気象・季節・労働時間など）を組み合わせた相関分析モデル


  **価値3: 「継続」の自動的動機付け**

  - 記録継続による「データが溜まるごとに精度が上がる体験」を設計する

  - 週間レポートで「先週より達成率が20%向上」といったフィードバック

  - 褒める・励ますなど、心理的サポートの機能を行動科学の知見に基づいて設計（ただし、具体的な効果は実証が必要）


  ### 有料化の根拠（重要度0.80の不明点）

  - 「気づき」だけでは無料アプリの範囲を超えにくい。**「支払いの対象は『提案の質』と『行動変容のサポート』'
